name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Docker уже установлен на GitHub-hosted раннерах - Testcontainers
      # поднимает PostgreSQL сам, отдельный service-контейнер не нужен.

      - name: Собрать и прогнать проверки (checkstyle, pmd, tests, jacoco)
        run: mvn -B verify

      - name: Mutation testing (PIT)
        run: mvn -B org.pitest:pitest-maven:mutationCoverage

      - name: Сформировать score.json
        if: always()
        run: python3 scripts/write_score.py

      - name: Опубликовать артефакт score
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: score
          path: score.json

      - name: Опубликовать отчёты (для отладки)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/pit-reports/
            target/checkstyle-result.xml
            target/pmd.xml
          if-no-files-found: ignore

      - name: Проверить итоговые гейты
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = Path("score.json")
          if not report.exists():
              raise SystemExit("score.json не создан")
          result = json.loads(report.read_text(encoding="utf-8"))
          failed = [name for name, gate in result["gates"].items() if not gate["passed"]]
          if failed:
              raise SystemExit("Не пройдены гейты: " + ", ".join(failed))
          print(f"Все гейты пройдены: {result['score']}/{result['max_score']}")
          PY
